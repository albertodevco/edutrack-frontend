<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | EduTrack IA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Tipografía Inter y FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos del Sistema -->
  <link rel="stylesheet" href="style.css">

  <!-- Configuración única (Supabase, API, tabla) -->
  <script src="config.js"></script>

  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Estilos adicionales para el interruptor de Registro/Login -->
  <style>
    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: #475569;
    }

    .auth-toggle a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-toggle a:hover {
      text-decoration: underline;
    }

    .form-title {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #1e293b;
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>

<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <i class="fas fa-brain"></i>
      </div>
      <h2>EduTrack</h2>
      <p>Inteligencia Artificial para Detección de Subregistro NEE</p>
    </div>

    <div class="login-content">

      <div class="login-alert" id="loginAlert"
        style="display: none; background-color: #fef2f2; border: 1px solid #f87171; color: #b91c1c;">
        <i class="fas fa-exclamation-circle"></i>
        <span id="loginAlertText"></span>
      </div>

      <!-- Formulario de Autenticación -->
      <form class="login-form" id="authForm">
        <div class="form-title" id="formTitle">Iniciar Sesión</div>

        <!-- Campo Nombre (Oculto por defecto, solo visible al Registrarse) -->
        <div class="form-group" id="nameGroup" style="display: none;">
          <label class="form-label" for="fullName">
            <span><i class="fas fa-user"></i> Nombre Completo</span>
          </label>
          <input type="text" name="fullName" id="fullName" class="form-input" placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <span><i class="fas fa-envelope"></i> Correo Electrónico Institucional</span>
          </label>
          <input type="email" name="email" id="email" class="form-input" placeholder="ejemplo@edutrack.edu.co" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <span><i class="fas fa-lock"></i> Contraseña</span>
          </label>
          <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login" id="btnAuth">
          <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Botón de Cambio Login / Registro -->
      <div class="auth-toggle">
        <span id="toggleStaticText">¿No tienes cuenta?</span>
        <a id="toggleLink">Regístrate aquí</a>
      </div>

    </div>
  </div>

  <div class="login-footer">
    <p>EduTrack · Proyecto de Inteligencia Artificial (7mo Semestre)</p>
    <p>Basado en datos oficiales de Educación Formal del DANE 2024</p>
  </div>

  <script>
    // 1. Inicializar Supabase desde config.js
    const cfg = window.EDUTRACK_CONFIG || {};
    const supabaseApp = (window.supabase && cfg.SUPABASE_URL)
      ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY)
      : null;

    // 2. Si ya tiene sesión iniciada, redirigir al panel principal
    if (supabaseApp) {
      supabaseApp.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          window.location.replace('index.html');
        }
      });
    }

    const form = document.getElementById('authForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const btnAuth = document.getElementById('btnAuth');

    // Elementos del Toggle
    let isLoginMode = true;
    const nameGroup = document.getElementById('nameGroup');
    const fullNameInput = document.getElementById('fullName');
    const formTitle = document.getElementById('formTitle');
    const toggleLink = document.getElementById('toggleLink');
    const toggleStaticText = document.getElementById('toggleStaticText');

    // 3. Lógica para alternar entre Login y Registro
    toggleLink.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      alertBox.style.display = 'none'; // Ocultar alertas previas
      form.reset(); // Limpiar todos los campos

      if (isLoginMode) {
        formTitle.textContent = 'Iniciar Sesión';
        nameGroup.style.display = 'none';
        fullNameInput.required = false;
        btnAuth.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
        toggleStaticText.textContent = '¿No tienes cuenta?';
        toggleLink.textContent = 'Regístrate aquí';
      } else {
        formTitle.textContent = 'Crear Cuenta';
        nameGroup.style.display = 'block';
        fullNameInput.required = true;
        btnAuth.innerHTML = '<i class="fas fa-user-plus"></i> Registrarse en EduTrack';
        toggleStaticText.textContent = '¿Ya tienes cuenta?';
        toggleLink.textContent = 'Inicia sesión aquí';
      }
    });

    // 4. Lógica de Envío de Datos (Submit)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!supabaseApp) {
        showError('No se pudo inicializar Supabase. Revisa config.js y tu conexión.');
        return;
      }

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;

      btnAuth.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Procesando...';
      btnAuth.disabled = true;
      alertBox.style.display = 'none';

      if (isLoginMode) {
        // PETICIÓN DE INICIO DE SESIÓN
        const { data, error } = await supabaseApp.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          showError("Credenciales incorrectas o usuario no registrado.");
          resetBtn('<i class="fas fa-sign-in-alt"></i> Iniciar Sesión');
        } else {
          const savedUsers = JSON.parse(localStorage.getItem('eduTrackUsersDict') || '{}');
          const nombre = (data.user && data.user.user_metadata && data.user.user_metadata.full_name)
            || savedUsers[email] || "Usuario EduTrack";
          saveAndRedirect(email, nombre);
        }
      } else {
        // PETICIÓN DE REGISTRO
        const { data, error } = await supabaseApp.auth.signUp({
          email: email,
          password: password,
          options: { data: { full_name: fullName } }
        });

        if (error) {
          // Traductor de errores reales de Supabase
          let errorMsg = error.message;
          if (error.message.includes("already registered")) {
            errorMsg = "Este correo ya está registrado. Inicia sesión.";
          } else if (error.message.includes("rate limit") || error.message.includes("over the email rate limit")) {
            errorMsg = "Por seguridad, Supabase bloqueó temporalmente los registros (Límite de intentos). Espera unos minutos.";
          } else if (error.message.includes("Signups not allowed")) {
            errorMsg = "El registro de nuevos usuarios está desactivado en tu panel de Supabase.";
          } else if (error.message.includes("weak")) {
            errorMsg = "La contraseña es muy débil (mínimo 6 caracteres).";
          }

          showError("Error: " + errorMsg);
          resetBtn('<i class="fas fa-user-plus"></i> Registrarse en EduTrack');
        } else {
          const savedUsers = JSON.parse(localStorage.getItem('eduTrackUsersDict') || '{}');
          savedUsers[email] = fullName;
          localStorage.setItem('eduTrackUsersDict', JSON.stringify(savedUsers));

          // Si el proyecto exige confirmación por correo, Supabase no devuelve
          // sesión: no se redirige para evitar el bucle login → index → login.
          if (data.session) {
            saveAndRedirect(email, fullName);
          } else {
            showInfo('Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.');
            resetBtn('<i class="fas fa-user-plus"></i> Registrarse en EduTrack');
            isLoginMode = true;
            formTitle.textContent = 'Iniciar Sesión';
            nameGroup.style.display = 'none';
            fullNameInput.required = false;
            toggleStaticText.textContent = '¿No tienes cuenta?';
            toggleLink.textContent = 'Regístrate aquí';
          }
        }
      }
    });

    function showError(msg) {
      alertBox.style.display = 'flex';
      alertBox.style.backgroundColor = '#fef2f2';
      alertBox.style.border = '1px solid #f87171';
      alertBox.style.color = '#b91c1c';
      alertText.textContent = msg;
    }

    function showInfo(msg) {
      alertBox.style.display = 'flex';
      alertBox.style.backgroundColor = '#f0fdf4';
      alertBox.style.border = '1px solid #86efac';
      alertBox.style.color = '#15803d';
      alertText.textContent = msg;
    }

    function resetBtn(htmlContent) {
      btnAuth.innerHTML = htmlContent;
      btnAuth.disabled = false;
    }

    function saveAndRedirect(email, name) {
      // Guardar metadatos de sesión actual para index.html
      localStorage.setItem('eduTrackUser', JSON.stringify({
        email: email,
        name: name,
        role: "Analista/Docente",
        inst: "Sede Educativa Oficial"
      }));
      window.location.replace('index.html');
    }
  </script>
</body>

</html>
