<!-- Justo antes de cerrar el </head>, añade el SDK de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- En el <body>, cambia el formulario -->
<form id="loginForm" class="login-form">
    <div class="form-group">
        <label>Correo Electrónico</label>
        <input type="email" id="email" required>
    </div>
    <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary full-width">Ingresar</button>
</form>

<script>
    const supabaseUrl = 'TU_SUPABASE_PROJECT_URL';
    const supabaseKey = 'TU_SUPABASE_ANON_KEY';
    const supabase = supabaseClient.createClient(supabaseUrl, supabaseKey);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) alert("Credenciales incorrectas");
        else window.location.href = 'index.html';
    });
</script>
